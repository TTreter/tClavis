<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Vibrant Cyan-to-Purple Gradient for Key Body -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Electric Cyan Gradient for Teeth -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Base App Squircle Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="4" filter="url(#tile-shadow)" />

  <!-- Center Ambient Radial Halo -->
  <circle cx="256" cy="240" r="150" fill="#38bdf8" opacity="0.06" filter="url(#neon-glow)" />

  <!-- Subtle Network Grid Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.05" stroke-width="1.5">
    <line x1="80" y1="130" x2="432" y2="130" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="382" x2="432" y2="382" />
    <line x1="140" y1="80" x2="140" y2="432" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="372" y1="80" x2="372" y2="432" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="90" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" 
        font-size="28" 
        letter-spacing="9" 
        fill="#f8fafc">tCLAVIS</text>

  <text x="256" y="110" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="700" 
        font-size="10" 
        letter-spacing="4" 
        fill="#38bdf8" 
        opacity="0.85">MIKROTIK HOTSPOT SYNC</text>

  <!-- === THE WI-FI ARCS (HEAD OF THE KEY) === -->
  <!-- Outer Wi-Fi Arch -->
  <path d="M 144 154 A 150 150 0 0 1 368 154" 
        fill="none" 
        stroke="url(#primary-glow)" 
        stroke-width="16" 
        stroke-linecap="round" 
        opacity="0.5" />

  <!-- Inner Wi-Fi Arch -->
  <path d="M 182 188 A 102 102 0 0 1 330 188" 
        fill="none" 
        stroke="url(#primary-glow)" 
        stroke-width="18" 
        stroke-linecap="round" 
        opacity="0.85" />

  <!-- Key Head Loop / Central Wi-Fi Core Hub -->
  <circle cx="256" cy="226" r="44" 
          fill="#0c1322" 
          stroke="url(#primary-glow)" 
          stroke-width="18" 
          filter="url(#neon-glow)" />

  <!-- Core Hub Inner Dot -->
  <circle cx="256" cy="226" r="14" fill="#00f2fe" />

  <!-- === THE KEY BODY (SOLID SHAPES - GUARANTEED RENDERING) === -->
  <!-- Vertical Key Shaft (Stem) -->
  <rect x="246" y="248" width="20" height="162" rx="10" 
        fill="url(#primary-glow)" 
        filter="url(#neon-glow)" />

  <!-- "t" Crossbar / Bridge -->
  <rect x="206" y="292" width="100" height="18" rx="9" 
        fill="url(#primary-glow)" 
        filter="url(#neon-glow)" />

  <!-- Key Teeth / Router Bit Profiles (Right side) -->
  <!-- Tooth 1 -->
  <rect x="256" y="344" width="48" height="16" rx="8" 
        fill="url(#cyan-glow)" 
        filter="url(#neon-glow)" />

  <!-- Tooth 2 -->
  <rect x="256" y="378" width="36" height="16" rx="8" 
        fill="url(#cyan-glow)" 
        filter="url(#neon-glow)" />

  <!-- === 3 SYNC SATELLITE NODES (THE 3 MIKROTIK ROUTERS) === -->
  <!-- Fiber Sync Data Beams -->
  <path d="M 152 396 Q 200 400 246 410" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="3" 
        stroke-dasharray="6,5" 
        opacity="0.75" />

  <path d="M 360 396 Q 312 400 266 410" 
        fill="none" 
        stroke="#a855f7" 
        stroke-width="3" 
        stroke-dasharray="6,5" 
        opacity="0.75" />

  <path d="M 256 410 L 256 430" 
        fill="none" 
        stroke="#10b981" 
        stroke-width="3" 
        stroke-dasharray="4,4" 
        opacity="0.85" />

  <!-- Node 1: MikroTik 1 (Sede - Cyan) -->
  <g filter="url(#neon-glow)">
    <circle cx="140" cy="396" r="16" fill="#090d16" stroke="#38bdf8" stroke-width="4" />
    <circle cx="140" cy="396" r="7" fill="#38bdf8" />
  </g>

  <!-- Node 2: MikroTik 2 (Filial - Purple) -->
  <g filter="url(#neon-glow)">
    <circle cx="372" cy="396" r="16" fill="#090d16" stroke="#a855f7" stroke-width="4" />
    <circle cx="372" cy="396" r="7" fill="#a855f7" />
  </g>

  <!-- Node 3: MikroTik 3 (Anexo - Emerald) -->
  <g filter="url(#neon-glow)">
    <circle cx="256" cy="442" r="14" fill="#090d16" stroke="#10b981" stroke-width="4" />
    <circle cx="256" cy="442" r="6" fill="#10b981" />
  </g>
</svg>
