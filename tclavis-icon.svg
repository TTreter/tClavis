<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Key & Wi-Fi Primary Cyan-to-Purple Gradient -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Accent Emerald/Mint Gradient for Sync Nodes -->
    <linearGradient id="accent-sync" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Metallic Gold Accent for Key Teeth -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base App Tile with Smooth Rounded Corners -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="4" filter="url(#subtle-shadow)" />

  <!-- Subtle Ambient Glow in Center -->
  <circle cx="256" cy="220" r="160" fill="#38bdf8" opacity="0.07" filter="url(#neon-glow)" />

  <!-- Background Decorative Grid Lines (Subtle Network Mesh) -->
  <g stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1.5">
    <line x1="80" y1="120" x2="432" y2="120" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="392" x2="432" y2="392" />
    <line x1="140" y1="80" x2="140" y2="432" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="372" y1="80" x2="372" y2="432" />
  </g>

  <!-- Hotspot Wi-Fi Signal Arches (The Head of the Key) -->
  <!-- Outer Arch -->
  <path d="M 148 150 A 150 150 0 0 1 364 150" 
        fill="none" 
        stroke="url(#primary-glow)" 
        stroke-width="14" 
        stroke-linecap="round" 
        opacity="0.5" />

  <!-- Middle Arch -->
  <path d="M 184 186 A 100 100 0 0 1 328 186" 
        fill="none" 
        stroke="url(#primary-glow)" 
        stroke-width="16" 
        stroke-linecap="round" 
        opacity="0.85" />

  <!-- Inner Key Bow / Center Hotspot Hub (Ring) -->
  <circle cx="256" cy="225" r="46" 
          fill="#0f172a" 
          stroke="url(#primary-glow)" 
          stroke-width="16" 
          filter="url(#neon-glow)" />

  <!-- Central Key Hole / Router Core Dot -->
  <circle cx="256" cy="225" r="15" fill="#38bdf8" />

  <!-- The "t" Key Stem & Crossbar (Stylized tClavis Access Key) -->
  <!-- Vertical Key Stem -->
  <path d="M 256 271 L 256 410" 
        fill="none" 
        stroke="url(#primary-glow)" 
        stroke-width="18" 
        stroke-linecap="round" />

  <!-- "t" Crossbar / Network Bridge Bar -->
  <path d="M 218 316 L 294 316" 
        fill="none" 
        stroke="url(#primary-glow)" 
        stroke-width="16" 
        stroke-linecap="round" />

  <!-- Key Teeth / Router Bit Profiles (Simulating network data pins) -->
  <!-- Tooth 1 -->
  <path d="M 256 362 L 298 362" 
        fill="none" 
        stroke="url(#gold-grad)" 
        stroke-width="14" 
        stroke-linecap="round" />
  <!-- Tooth 2 -->
  <path d="M 256 395 L 286 395" 
        fill="none" 
        stroke="url(#gold-grad)" 
        stroke-width="14" 
        stroke-linecap="round" />

  <!-- 3 Sync Orbit Nodes representing the 3 Synchronized MikroTiks -->
  <!-- Left MikroTik Node -->
  <g filter="url(#neon-glow)">
    <circle cx="150" cy="390" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
    <circle cx="150" cy="390" r="6" fill="#38bdf8" />
  </g>
  <!-- Right MikroTik Node -->
  <g filter="url(#neon-glow)">
    <circle cx="362" cy="390" r="14" fill="#0f172a" stroke="#a855f7" stroke-width="4" />
    <circle cx="362" cy="390" r="6" fill="#a855f7" />
  </g>
  <!-- Bottom Center Node (Linked Router) -->
  <g filter="url(#neon-glow)">
    <circle cx="256" cy="442" r="12" fill="#0f172a" stroke="#34d399" stroke-width="4" />
    <circle cx="256" cy="442" r="5" fill="#34d399" />
  </g>

  <!-- Synchronization Connection Beams between Nodes & Key -->
  <path d="M 164 390 Q 210 395 246 410" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="3" 
        stroke-dasharray="6,6" 
        opacity="0.6" />

  <path d="M 348 390 Q 302 395 266 410" 
        fill="none" 
        stroke="#a855f7" 
        stroke-width="3" 
        stroke-dasharray="6,6" 
        opacity="0.6" />

  <path d="M 256 412 L 256 430" 
        fill="none" 
        stroke="#34d399" 
        stroke-width="3" 
        stroke-dasharray="4,4" 
        opacity="0.7" />

  <!-- Subtle Brand Signature / Modern Badge -->
  <text x="256" y="96" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" 
        font-size="28" 
        letter-spacing="9" 
        fill="#f8fafc" 
        opacity="0.9">tCLAVIS</text>

  <text x="256" y="116" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="600" 
        font-size="11" 
        letter-spacing="4" 
        fill="#38bdf8" 
        opacity="0.8">MIKROTIK HOTSPOT SYNC</text>
</svg>
