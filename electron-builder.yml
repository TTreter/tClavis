appId: com.treter.tclavis
productName: tClavis
copyright: Copyright © 2026 tClavis
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - build/**
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: tClavis
