appId: com.treter.tclavis
productName: tClavis
copyright: Copyright © 2026 tClavis
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
  - node_modules/sql.js/dist/sql-wasm.wasm
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: tclavis-icon.svg
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: tClavis
